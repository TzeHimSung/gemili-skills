name: ChatGPT PR code review

"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  chatgpt-review:
    name: Review PR with ChatGPT
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Keep repository secrets away from untrusted fork PRs. Maintainers can still
    # run the workflow manually for any PR by using workflow_dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.draft == false)

    steps:
      - name: Run GenAI code review
        continue-on-error: true
        uses: cirolini/genai-code-review@c316e1db847ecbcb530c5fb66c102fb8a3454a4d # v2
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_pr_id: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.number }}
          openai_model: ${{ vars.OPENAI_CODE_REVIEW_MODEL || 'gpt-4o-mini' }}
          openai_temperature: 0.2
          openai_max_tokens: 2048
          mode: patch
          language: zh-CN
          custom_prompt: |
            你是 TzeHimSung/gemili-skills 仓库的代码审查员。请用中文审查这个 PR diff。

            审查重点：
            1. Hermes skill 的行为是否和对应 SKILL.md / README.md 一致。
            2. Python 脚本是否有明显逻辑错误、异常处理缺失、路径/时区/cron 投递语义问题。
            3. 是否引入硬编码 secret、Telegram/Weixin 真实投递 ID、API token 或其它敏感信息。
            4. 是否误改 stock-deep-analysis/；如果改到了，请明确提醒需要额外人工确认。
            5. GitHub Actions / shell 代码是否避免执行不可信 PR 内容，权限是否最小化。

            输出要求：
            - 先给一个总体结论。
            - 再按“必须修复 / 建议改进 / 可接受”分组列出发现。
            - 没有问题时明确说明未发现阻塞问题，不要编造风险。
