name: ChatGPT PR code review

"on":
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  chatgpt-review:
    name: Review PR with ChatGPT
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Keep repository secrets away from untrusted fork PRs. pull_request_target
    # runs this workflow from the trusted base branch; the job never checks out
    # PR code and reads the candidate diff only through the GitHub API.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.draft == false

    steps:
      - name: Check out trusted review script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Run ChatGPT code review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.number }}
          OPENAI_MODEL: ${{ vars.OPENAI_CODE_REVIEW_MODEL || 'gpt-4o-mini' }}
          OPENAI_TEMPERATURE: "0.2"
          OPENAI_MAX_TOKENS: "2048"
          MAX_DIFF_CHARS: "60000"
          CUSTOM_PROMPT: |
            你是 TzeHimSung/gemili-skills 仓库的代码审查员。请用中文审查这个 PR diff。

            审查重点：
            1. Hermes skill 的行为是否和对应 SKILL.md / README.md 一致。
            2. Python 脚本是否有明显逻辑错误、异常处理缺失、路径/时区/cron 投递语义问题。
            3. 是否引入硬编码 secret、Telegram/Weixin 真实投递 ID、API token 或其它敏感信息。
            4. 是否误改 stock-deep-analysis/；如果改到了，请明确提醒需要额外人工确认。
            5. GitHub Actions / shell 代码是否避免执行不可信 PR 内容，权限是否最小化。
        run: python3 .github/scripts/chatgpt_pr_review.py
