name: Skill repository checks

"on":
  push:
    paths:
      - "5ch-roast/**"
      - "anison-live-countdown/**"
      - "cnhk-stock-tracker/**"
      - "cron-multi-platform-delivery/**"
      - "kaikatsu-club-vacancy/**"
      - "scripts/**"
      - "shared/**"
      - "tests/**"
      - "update-fedora-packages/**"
      - "us-stock-tracker/**"
      - "yahoo-jp-news-scraper/**"
      - "yahoo-jp-roast/**"
      - "README.md"
      - ".github/workflows/pylint.yml"
  pull_request:
    paths:
      - "5ch-roast/**"
      - "anison-live-countdown/**"
      - "cnhk-stock-tracker/**"
      - "cron-multi-platform-delivery/**"
      - "kaikatsu-club-vacancy/**"
      - "scripts/**"
      - "shared/**"
      - "tests/**"
      - "update-fedora-packages/**"
      - "us-stock-tracker/**"
      - "yahoo-jp-news-scraper/**"
      - "yahoo-jp-roast/**"
      - "README.md"
      - ".github/workflows/pylint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Offline audit, tests, and Python error gate
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pylint>=3,<4" requests pytest pyyaml

      - name: Validate workflow YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in sorted(Path('.github/workflows').glob('*.yml')):
              yaml.safe_load(path.read_text(encoding='utf-8'))
              print(f'YAML ok: {path}')
          PY

      - name: Run offline skill audit
        run: python scripts/skills_audit.py .

      - name: Run focused tests
        run: python -m pytest tests cron-multi-platform-delivery/tests -q

      - name: Run pylint on maintained skill scripts
        run: |
          python - <<'PY'
          from __future__ import annotations

          import pathlib
          import subprocess
          import sys

          ROOT = pathlib.Path.cwd()
          GROUPS = [
              "5ch-roast",
              "anison-live-countdown",
              "cnhk-stock-tracker",
              "cron-multi-platform-delivery",
              "kaikatsu-club-vacancy",
              "scripts",
              "shared",
              "tests",
              "us-stock-tracker",
              "yahoo-jp-news-scraper",
              "yahoo-jp-roast",
          ]
          EXCLUDED_PARTS = {"__pycache__", ".pytest_cache", ".cache", "data"}

          def tracked_python_files(group: str) -> list[str]:
              output = subprocess.check_output(
                  ["git", "ls-files", f"{group}/*.py", f"{group}/**/*.py"],
                  text=True,
              )
              files = []
              seen = set()
              for line in output.splitlines():
                  if line in seen:
                      continue
                  seen.add(line)
                  parts = set(pathlib.PurePosixPath(line).parts)
                  if EXCLUDED_PARTS.isdisjoint(parts):
                      files.append(line)
              return files

          def init_hook_for(group: str) -> str:
              paths = [
                  ROOT / group / "scripts",
                  ROOT / "shared" / "scripts",
                  ROOT / "scripts",
              ]
              return (
                  "import sys; "
                  f"sys.path[:0] = {[str(path) for path in paths]!r}"
              )

          any_files = False
          for group in GROUPS:
              files = tracked_python_files(group)
              if not files:
                  continue
              any_files = True
              print(f"::group::pylint {group}")
              try:
                  subprocess.run(
                      [
                          sys.executable,
                          "-m",
                          "pylint",
                          "--errors-only",
                          "--jobs=0",
                          f"--init-hook={init_hook_for(group)}",
                          *files,
                      ],
                      check=True,
                  )
              finally:
                  print("::endgroup::")

          if not any_files:
              raise SystemExit("No Python files found for pylint")
          PY
